<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Details</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:0;
}

.header{
    background:#0077b6;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    color:#0077b6;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#0077b6;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>
<body>

<div class="header">
    <h2>Hospital Service Details</h2>
</div>

<div class="container">

    <h1 id="serviceTitle"></h1>

    <p id="serviceInfo"></p>

    <!-- Extra Information -->
    <h3>Additional Information</h3>

    <p id="extraInfo">
        Our hospital provides modern healthcare facilities with expert doctors,
        advanced equipment, and 24/7 emergency support for all patients.
    </p>

    <a href="index.html" class="back-btn">⬅ Back</a>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const title = params.get("title");
const info = params.get("info");

document.getElementById("serviceTitle").innerText = title;
document.getElementById("serviceInfo").innerText = info;

</script>

</body>
</html>
